name: Bug report
description: Something does not work as the README or the types say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not post a widget id, a real shop domain or a merchant's email. Use placeholders.
        For a security problem, do not file an issue: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version (or browser, if the bug is in the browser)
      placeholder: Node 22.x / Safari 18
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: Which entry point
      options:
        - SupportChat (React)
        - loadSupportChat (plain browser code)
        - supportChatTag / supportChatScript (HTML strings)
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Steps or a small snippet, with placeholder values only.
    validations:
      required: true
