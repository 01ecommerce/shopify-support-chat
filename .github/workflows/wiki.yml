name: wiki

# The wiki is a GENERATED mirror of README.md, docs/ and CHANGELOG.md. Never edit it by hand: the next
# run overwrites it. scripts/build-wiki.js builds the pages; this job publishes them.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - CHANGELOG.md
      - docs/**
      - scripts/build-wiki.js
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: write

# One at a time and never cancelled, so the last write wins in push order.
concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Generate the pages
        run: |
          node scripts/build-wiki.js "$RUNNER_TEMP/wiki-out" "$GITHUB_SHA"
          echo "generated $(find "$RUNNER_TEMP/wiki-out" -name "*.md" | wc -l) pages"
      - name: Clone the wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          echo "cloned the wiki ($(git -C "$RUNNER_TEMP/wiki" ls-files | wc -l) tracked files)"
      - name: Replace every page with the generated set
        run: |
          cd "$RUNNER_TEMP/wiki"
          # Drop every tracked page (the placeholder and any page no longer generated); .git stays.
          git rm -q --ignore-unmatch -- '*.md'
          cp "$RUNNER_TEMP"/wiki-out/*.md .
          git add -A
          git status --short
      - name: Commit and push
        run: |
          cd "$RUNNER_TEMP/wiki"
          if [ -z "$(git status --porcelain)" ]; then
            echo "wiki already current"
            exit 0
          fi
          echo "wiki changed: $(git status --porcelain | wc -l) files"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin HEAD:master
          echo "pushed to master"
